<div class="flex h-full overflow-hidden">
  @if (sidebarOpen()) {
    @if (!isDesktop()) {
      <button
        type="button"
        class="fixed inset-0 z-20 bg-black/60"
        aria-label="Close sidebar"
        (click)="sidebarOpen.set(false)"
      ></button>
    }
    <app-sidebar
      class="z-30"
      [class.fixed]="!isDesktop()"
      [class.inset-y-0]="!isDesktop()"
      [class.left-0]="!isDesktop()"
      (newSearch)="newSearch()"
      (upload)="openUpload()"
      (apiKeys)="openKeys()"
      (searchSelected)="openSearch($event)"
    />
  }

  <app-chat-view (toggleSidebar)="sidebarOpen.set(!sidebarOpen())" (upload)="openUpload()" />
</div>

<app-upload-dialog (addKey)="openKeys()" />
<app-api-keys-dialog />
