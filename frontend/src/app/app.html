<div class="flex h-full overflow-hidden">
  @if (sidebarOpen()) {
    @if (!isDesktop()) {
      <button
        type="button"
        class="fixed inset-0 z-20 bg-black/60"
        aria-label="Close sidebar"
        (click)="sidebarOpen.set(false)"
      ></button>
    }
    <app-sidebar
      class="z-30"
      [class.fixed]="!isDesktop()"
      [class.inset-y-0]="!isDesktop()"
      [class.left-0]="!isDesktop()"
      (newSearch)="newSearch()"
      (turnSelected)="showTurn($event)"
    />
  }

  <app-chat-view (toggleSidebar)="sidebarOpen.set(!sidebarOpen())" />
</div>

@if (dragging()) {
  <div class="pointer-events-none fixed inset-0 z-40 grid place-items-center bg-canvas/80 p-6 backdrop-blur-sm">
    <div class="flex flex-col items-center gap-3 rounded-2xl border-2 border-dashed border-accent/60 px-12 py-10 text-center">
      <app-icon name="upload" [size]="28" class="text-accent" />
      <p class="text-base font-medium text-ink">Drop files to upload</p>
      <p class="text-sm text-ink-muted">PDF, DOCX or TXT · up to 20 MB each</p>
    </div>
  </div>
}
